<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bogie Depot</title>
  <style>
:root { --fg:#1c1b19; --muted:#6a675f; --line:#e4e1d8; --bg:#faf8f3; --accent:#c8501e; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, sans-serif; color:var(--fg); background:var(--bg); }
header { display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid var(--line); background:#fff; }
header a { color:var(--fg); text-decoration:none; }
header .brand { font-weight:700; font-size:1.2rem; }
header nav { margin-left:auto; display:flex; gap:1rem; align-items:center; }
main { max-width:960px; margin:0 auto; padding:1.5rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1rem; }
.card { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; text-decoration:none; color:inherit; display:block; }
.card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
.card .body { padding:.75rem; }
.price { color:var(--accent); font-weight:600; }
.muted { color:var(--muted); }
button, .button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:.5rem 1rem; font-size:1rem; cursor:pointer; text-decoration:none; display:inline-block; }
button.secondary { background:#fff; color:var(--fg); border:1px solid var(--line); }
input, select { padding:.5rem; border:1px solid var(--line); border-radius:6px; font-size:1rem; }
.error { color:#b00020; }
table { width:100%; border-collapse:collapse; background:#fff; }
th, td { text-align:left; padding:.5rem; border-bottom:1px solid var(--line); }
.row { display:flex; gap:1rem; flex-wrap:wrap; align-items:center; }
.detail { display:grid; grid-template-columns:minmax(200px,360px) 1fr; gap:1.5rem; }
.detail img { width:100%; border-radius:8px; border:1px solid var(--line); }
@media (max-width:640px){ .detail{grid-template-columns:1fr;} }
</style>
</head>
<body>
  <header>
    <a class="brand" href="/">Bogie Depot</a>
    <nav><span id="account"></span><a href="/cart.html">Cart (<span id="badge">0</span>)</a></nav>
  </header>
  <main>
    <h1>Merch</h1>
    <p id="categories" class="row"></p>
    <p id="status" class="muted">Loading...</p>
    <div id="products" class="grid"></div>
    <p id="pages" class="row"></p>
  </main>
  <script>

const dollars = (cents) => "$" + (cents / 100).toFixed(2);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// The token: a guest token from POST /guest_sessions, or a signed-in token.
const tokenKey = "depot_token";
const userKey = "depot_user";
const getToken = () => localStorage.getItem(tokenKey);
const setToken = (t) => localStorage.setItem(tokenKey, t);
async function ensureToken() {
  if (getToken()) return getToken();
  const res = await fetch("/guest_sessions", { method: "POST" });
  if (!res.ok) throw new Error("could not start a guest session");
  const data = await res.json();
  setToken(data.token);
  return data.token;
}
async function api(method, path, body, retried) {
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const route = path.split("?")[0];
  const needsToken = route !== "/products" && !route.startsWith("/products/") && !path.startsWith("/categories") && !path.startsWith("/guest_sessions") && !path.startsWith("/sessions") && path !== "/users";
  if (needsToken) {
    headers["Authorization"] = "Bearer " + await ensureToken();
  } else if (getToken()) {
    headers["Authorization"] = "Bearer " + getToken();
  }
  const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  // An expired token: forget it, get a fresh guest token, and try once more.
  if (res.status === 401 && needsToken && !retried) {
    localStorage.removeItem(tokenKey);
    localStorage.removeItem(userKey);
    return api(method, path, body, true);
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error((data && data.error) || ("HTTP " + res.status)); err.status = res.status; throw err; }
  return data;
}

function showBadge(cart) {
  const n = cart.items.reduce((sum, i) => sum + i.quantity, 0);
  const badge = document.getElementById("badge");
  if (badge) badge.textContent = n;
}
async function refreshBadge() {
  try { showBadge(await api("GET", "/cart")); } catch (e) {}
}

function renderAccount() {
  const el = document.getElementById("account");
  if (!el) return;
  const user = JSON.parse(localStorage.getItem(userKey) || "null");
  if (user) {
    let html = "";
    if (user.staff) html += '<a href="/admin/products.html">Admin</a> ';
    html += '<span class="muted">' + esc(user.email) + '</span> <a href="#" id="signout">Sign out</a>';
    el.innerHTML = html;
    document.getElementById("signout").addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem(tokenKey); localStorage.removeItem(userKey);
      location.href = "/";
    });
  } else {
    el.innerHTML = '<a href="/signin.html">Sign in</a> <a href="/signup.html">Sign up</a>';
  }
}
renderAccount();

// Staff see an Admin link. The API decides who is staff: ask it once per sign-in.
(async function probeStaff() {
  const user = JSON.parse(localStorage.getItem(userKey) || "null");
  if (!user || user.staff !== undefined) return;
  try { await api("GET", "/admin/products"); user.staff = true; } catch (e) { user.staff = false; }
  localStorage.setItem(userKey, JSON.stringify(user));
  if (user.staff) renderAccount();
})();


const params = new URLSearchParams(location.search);
const categoryId = params.get("category_id");
const pageNo = Number(params.get("page") || 1);
function link(label, cat, page, current) {
  const q = new URLSearchParams();
  if (cat) q.set("category_id", cat);
  if (page > 1) q.set("page", page);
  const a = document.createElement("a");
  a.href = "/" + (q.toString() ? "?" + q : "");
  a.textContent = label;
  if (current) { a.style.fontWeight = "bold"; a.style.textDecoration = "underline"; }
  return a;
}
async function loadCategories() {
  const box = document.getElementById("categories");
  try {
    const data = await api("GET", "/categories");
    box.appendChild(link("All", null, 1, !categoryId));
    for (const c of data.categories) box.appendChild(link(c.name + " (" + c.product_count + ")", String(c.id), 1, categoryId === String(c.id)));
  } catch (e) {}
}
async function load() {
  const status = document.getElementById("status");
  const grid = document.getElementById("products");
  try {
    const q = new URLSearchParams({ page: pageNo });
    if (categoryId) q.set("category_id", categoryId);
    const data = await api("GET", "/products?" + q);
    status.textContent = data.products.length ? "" : "No products here.";
    for (const p of data.products) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = "/product.html?id=" + p.id;
      a.innerHTML = '<img alt=""><div class="body"><div></div><div class="price"></div></div>';
      a.querySelector("img").src = p.image_url;
      a.querySelector("img").alt = p.name;
      a.querySelector(".body div").textContent = p.name;
      a.querySelector(".price").textContent = dollars(p.price_cents);
      grid.appendChild(a);
    }
    const last = Math.max(1, Math.ceil(data.total / data.per_page));
    const nav = document.getElementById("pages");
    if (last > 1) for (let n = 1; n <= last; n++) nav.appendChild(link(String(n), categoryId, n, n === data.page));
  } catch (err) {
    status.textContent = "Could not load the catalog: " + err.message;
    status.className = "error";
  }
}
loadCategories();
load();
refreshBadge();

  </script>
</body>
</html>
