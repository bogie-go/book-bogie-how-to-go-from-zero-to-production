<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coupons - Bogie Depot Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body>
    <div class="shell" id="shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="/admin/index.html">Bogie Depot<small>admin</small></a>
        <nav id="admin-nav"></nav>
        <div class="who">
          <span id="admin-email"></span>
          <div><button type="button" id="signout">Sign out</button></div>
        </div>
      </aside>
      <main class="content">
        <div class="bar">
          <h1 id="list-title">Coupons</h1>
          <a class="btn primary" id="new-link" href="#">New</a>
        </div>
        <p class="note" id="status">Loading...</p>
        <table id="list" hidden><thead></thead><tbody></tbody></table>
        <p class="err" id="message"></p>
      </main>
    </div>
    <p class="state" id="gate">Checking access&hellip;</p>
    <script src="/admin/admin.js"></script>
    <script>
      adminReady({ categories: true }).then((ok) => {
        if (ok) adminList(ADMIN_SECTIONS.coupons, {});
      });
    </script>
  </body>
</html>
