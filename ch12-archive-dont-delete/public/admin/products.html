<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products - Bogie Depot Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body>
    <div class="shell" id="shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="/admin/products.html">Bogie Depot<small>admin</small></a>
        <nav id="admin-nav"></nav>
        <div class="who">
          <span id="admin-email"></span>
          <div><button type="button" id="signout">Sign out</button></div>
        </div>
      </aside>
      <main class="content">
        <h1>Products</h1>
        <p class="note" id="status">Loading...</p>
        <table id="list" hidden><thead></thead><tbody></tbody></table>
        <h2 id="form-title">New</h2>
        <form id="form" class="form"></form>
        <p class="err" id="message"></p>
      </main>
    </div>
    <p class="state" id="gate">Checking access&hellip;</p>
    <script src="/admin/admin.js"></script>
    <script>
      const RES = {"slug": "products", "key": "products", "fields": [["name", "Name", "text"], ["description", "Description", "text"], ["price_cents", "Price (cents)", "number"], ["stock", "Stock", "number"], ["image_url", "Image URL", "text"]]};
      adminReady({ categories: false }).then((ok) => {
        if (ok) adminResource(RES, { archive: true, productCategories: false });
      });
    </script>
  </body>
</html>
