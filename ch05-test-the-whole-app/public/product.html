<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bogie Depot</title>
  <style>
:root { --fg:#1c1b19; --muted:#6a675f; --line:#e4e1d8; --bg:#faf8f3; --accent:#c8501e; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, sans-serif; color:var(--fg); background:var(--bg); }
header { display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid var(--line); background:#fff; }
header a { color:var(--fg); text-decoration:none; }
header .brand { font-weight:700; font-size:1.2rem; }
header nav { margin-left:auto; display:flex; gap:1rem; align-items:center; }
main { max-width:960px; margin:0 auto; padding:1.5rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1rem; }
.card { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; text-decoration:none; color:inherit; display:block; }
.card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
.card .body { padding:.75rem; }
.price { color:var(--accent); font-weight:600; }
.muted { color:var(--muted); }
button, .button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:.5rem 1rem; font-size:1rem; cursor:pointer; text-decoration:none; display:inline-block; }
button.secondary { background:#fff; color:var(--fg); border:1px solid var(--line); }
input, select { padding:.5rem; border:1px solid var(--line); border-radius:6px; font-size:1rem; }
.error { color:#b00020; }
table { width:100%; border-collapse:collapse; background:#fff; }
th, td { text-align:left; padding:.5rem; border-bottom:1px solid var(--line); }
.row { display:flex; gap:1rem; flex-wrap:wrap; align-items:center; }
.detail { display:grid; grid-template-columns:minmax(200px,360px) 1fr; gap:1.5rem; }
.detail img { width:100%; border-radius:8px; border:1px solid var(--line); }
@media (max-width:640px){ .detail{grid-template-columns:1fr;} }
</style>
</head>
<body>
  <header>
    <a class="brand" href="/">Bogie Depot</a>
  </header>
  <main>
    <p><a href="/">&larr; All merch</a></p>
    <p id="status" class="muted">Loading...</p>
    <div id="product" class="detail" hidden>
      <img id="image" alt="">
      <div>
        <h1 id="name"></h1>
        <p class="price" id="price"></p>
        <p id="description"></p>
        <p class="muted" id="stock"></p>
      </div>
    </div>
  </main>
  <script>
    // Fetches GET /products/:id for the id in the address.
    const dollars = (cents) => "$" + (cents / 100).toFixed(2);

    async function load() {
      const status = document.getElementById("status");
      const id = new URLSearchParams(location.search).get("id");
      try {
        const res = await fetch("/products/" + encodeURIComponent(id));
        if (res.status === 404) { status.textContent = "No such product."; return; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        const p = await res.json();
        document.title = p.name + " - Bogie Depot";
        document.getElementById("image").src = p.image_url;
        document.getElementById("image").alt = p.name;
        document.getElementById("name").textContent = p.name;
        document.getElementById("price").textContent = dollars(p.price_cents);
        document.getElementById("description").textContent = p.description;
        document.getElementById("stock").textContent = p.stock > 0 ? p.stock + " in stock" : "Out of stock";
        status.hidden = true;
        document.getElementById("product").hidden = false;
      } catch (err) {
        status.textContent = "Could not load the product: " + err.message;
        status.className = "error";
      }
    }
    load();
  </script>
</body>
</html>
